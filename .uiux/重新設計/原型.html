<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>茄記 重新設計原型</title>
<style>
  /* 介面色：抄 src/lib/tokens.ts 的 light／dark 值，沒有新顏色 */
  :root{
    --page:#FBF3E7; --surface:#FFFCF6; --sep:#EADFCF;
    --text:#2E2233; --text2:#75677A; --accent:#7D467F; --danger:#C83C32; --clay:#7E6F5F;
    --paper:#FFFCF6; --scrim:rgba(0,0,0,.3); --shadow:0 3px 10px rgba(59,32,80,.12); --shadow2:0 4px 10px rgba(59,32,80,.3);
    --muted:rgba(46,34,51,.7);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page:#211A27; --surface:#2B2231; --sep:#41364A;
      --text:#F2EAF1; --text2:#B5A6BB; --accent:#CDA3D0; --danger:#E9837A; --clay:#5A4E45;
      --muted:rgba(242,234,241,.8);
    }
  }
  :root.dark{--page:#211A27; --surface:#2B2231; --sep:#41364A;
      --text:#F2EAF1; --text2:#B5A6BB; --accent:#CDA3D0; --danger:#E9837A; --clay:#5A4E45;
      --muted:rgba(242,234,241,.8);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#1c1620;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--text)}
  body{display:flex;align-items:center;justify-content:center;gap:40px;min-height:100vh;padding:16px}
  .note{color:#bfb3c4;font-size:14px;line-height:1.7;max-width:280px}
  .note b{color:#fff}
  .note kbd{background:#3a2f42;border-radius:6px;padding:1px 6px;font-size:12px}

  /* ---------- 手機框：iPhone 17 直式 402 × 874 pt ---------- */
  .wrap{width:402px;height:874px;flex:none;transform-origin:top left}
  .phone{position:relative;width:402px;height:874px;border-radius:54px;overflow:clip;background:var(--page);box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.6)}
  .status{position:absolute;top:0;left:0;right:0;height:62px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px;font-size:15px;font-weight:600;pointer-events:none;z-index:5}
  .island{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000}
  .home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--text);opacity:.35;pointer-events:none;z-index:5}

  /* ---------- 紙（根畫面） ---------- */
  .sheet-paper{position:absolute;inset:0;display:flex;flex-direction:column;transition:background-color .15s}
  .top{display:flex;align-items:center;gap:8px;padding:70px 16px 8px 20px}
  .title{flex:1;display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer;padding:6px 8px 6px 0;border-radius:12px}
  .title h1{margin:0;font-size:28px;font-weight:700;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
  .title h1:empty:before{content:"沒有名字的一張";color:var(--text2);font-weight:600}
  .title .chev{flex:none;width:22px;height:22px;border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--accent);font-size:12px;box-shadow:var(--shadow)}
  .pin{flex:none;color:var(--text2);font-size:13px;margin-right:2px}
  .btn{width:44px;height:44px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--text);cursor:pointer;font-size:20px;line-height:1;border:0}
  .btn:active{opacity:.6}

  .lines{flex:1;overflow:auto;padding:4px 0 120px;scrollbar-width:none}
  .lines::-webkit-scrollbar{display:none}
  .row{position:relative;overflow:hidden;user-select:none}
  .row .bg{position:absolute;inset:0;display:flex;align-items:center;padding:0 20px;color:var(--paper);font-size:15px;font-weight:600;background:var(--clay);opacity:0}
  .row .bg.del{justify-content:flex-end;background:#C83C32}
  .row .fg{position:relative;padding:12px 20px;font-size:17px;line-height:27px;min-height:54px;display:flex;align-items:center;background:var(--rowbg);border-bottom:1px solid var(--rule);transition:transform .18s cubic-bezier(.2,.7,.2,1)}
  .row .fg span{flex:1;outline:none;white-space:pre-wrap;word-break:break-word}
  .row.done .fg span{text-decoration:line-through;color:var(--muted)}
  .row.new .fg{animation:drop .25s cubic-bezier(.2,.7,.2,1)}
  @keyframes drop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
  .divider{display:flex;align-items:center;gap:8px;padding:18px 20px 6px;color:var(--text2);font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer}
  .divider:before{content:"";flex:1;height:1px;background:var(--rule)}
  .divider .ch{transition:transform .15s}
  .paper.fold .doneRows{display:none}
  .paper.fold .divider .ch{transform:rotate(-90deg)}
  .empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:120px 24px 0;color:var(--text2);font-size:15px;line-height:24px;text-align:center}
  .empty img{width:72px;opacity:.9}
  .hint{text-align:center;color:var(--text2);font-size:13px;padding:28px 20px 0;opacity:.9}

  /* ---------- 底部輸入列 ---------- */
  .composer{position:absolute;left:16px;right:16px;bottom:34px;height:50px;border-radius:25px;background:var(--surface);box-shadow:var(--shadow2);display:flex;align-items:center;gap:10px;padding:0 8px 0 10px;z-index:4}
  .composer img{width:30px;height:30px;object-fit:contain;flex:none}
  .composer .in{flex:1;font:inherit;font-size:17px;border:0;outline:0;background:transparent;color:var(--text);min-width:0}
  .composer .in::placeholder{color:var(--text2)}
  .composer .send{width:36px;height:36px;border-radius:18px;border:0;background:var(--accent);color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;opacity:0;transform:scale(.6);transition:all .15s}
  .composer.has .send{opacity:1;transform:none}

  /* ---------- 目錄面板 ---------- */
  .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .18s;z-index:8}
  .dir{position:absolute;left:0;right:0;bottom:0;height:88%;background:var(--surface);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.7,.2,1);z-index:9;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
  .phone.open .scrim{opacity:1;pointer-events:auto}
  .phone.open .dir{transform:none}
  .grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:8px auto 0}
  .dirTop{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
  .search{flex:1;height:40px;border-radius:14px;background:var(--page);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text2);font-size:15px}
  .search input{flex:1;border:0;background:transparent;outline:0;font:inherit;color:var(--text);min-width:0}
  .dirBody{flex:1;overflow:auto;padding:4px 16px 40px;scrollbar-width:none}
  .sec{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--text2);margin:16px 4px 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{position:relative;height:84px;border-radius:16px;padding:14px 14px 0;font-size:17px;font-weight:600;line-height:22px;overflow:hidden;cursor:pointer;border:1px solid transparent;color:var(--text)}
  .tile:active{opacity:.6}
  .tile.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .tile .tag{position:absolute;right:-10px;bottom:-10px;width:40px;height:40px;border-radius:20px;opacity:.9}
  .tile.add{border:1.5px dashed var(--sep);background:transparent;color:var(--accent);display:flex;align-items:center;gap:6px;padding-top:0;font-weight:600}
  .tile.add b{font-size:24px;font-weight:400;line-height:1}
  .trashRow{display:flex;align-items:center;gap:10px;margin-top:24px;padding:14px 4px;border-top:1px solid var(--sep);color:var(--text2);font-size:15px;cursor:pointer}
  .trashRow .sp{flex:1}

  /* ---------- 長按選單、⋯ 選單 ---------- */
  .pop{position:absolute;z-index:12;min-width:200px;background:var(--surface);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:6px;display:none;transform-origin:top right;animation:pop .17s cubic-bezier(.2,.7,.2,1)}
  .pop.show{display:block}
  @keyframes pop{from{transform:scale(.9);opacity:0}}
  .pop .it{display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 12px;border-radius:10px;font-size:17px;cursor:pointer;color:var(--text)}
  .pop .it:active{background:rgba(125,70,127,.08)}
  .pop .it.red{color:var(--danger)}
  .pop .it .ic{color:var(--text2);font-size:15px}
  .pop .hr{height:1px;background:var(--sep);margin:6px 4px}
  .sw{display:flex;gap:6px;padding:8px 10px 6px;justify-content:space-between}
  .sw i{width:26px;height:26px;border-radius:13px;border:2px solid transparent;cursor:pointer;display:block}
  .sw i.on{border-color:var(--accent)}
  .toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,10px);background:rgba(58,46,66,.94);color:#fff;font-size:15px;padding:10px 16px;border-radius:22px;display:flex;gap:14px;opacity:0;transition:all .15s;z-index:20;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast b{color:#D7B8F3;font-weight:600;cursor:pointer}
  @media (prefers-color-scheme: dark){ .toast{background:rgba(237,227,236,.94);color:#2E2233} .toast b{color:#7D467F} }
  :root.dark .toast{background:rgba(237,227,236,.94);color:#2E2233} :root.dark .toast b{color:#7D467F}
  @media (max-width:760px){ body{flex-direction:column;gap:16px} .note{max-width:402px} }
</style>
</head>
<body>

<div class="wrap" id="wrap">
<div class="phone" id="phone">
  <div class="status"><span>9:41</span><span class="island"></span><span>●●● ▲ ▮</span></div>

  <!-- 紙 -->
  <div class="sheet-paper paper" id="paper">
    <div class="top">
      <div class="title" id="titleBtn" title="點一下換一張">
        <span class="pin" id="pin" hidden>📌</span>
        <h1 id="title" spellcheck="false"></h1>
        <span class="chev">⌄</span>
      </div>
      <button class="btn" id="moreBtn" aria-label="選單">⋯</button>
    </div>
    <div class="lines" id="lines"></div>
  </div>

  <!-- 底部輸入列 -->
  <form class="composer" id="composer" autocomplete="off">
    <img id="face" alt="">
    <input class="in" id="input" placeholder="記點什麼…" enterkeyhint="done">
    <button class="send" type="submit" aria-label="記下">↵</button>
  </form>

  <!-- 目錄面板 -->
  <div class="scrim" id="scrim"></div>
  <div class="dir" id="dir">
    <div class="grab"></div>
    <div class="dirTop">
      <div class="search">🔍<input id="q" placeholder="搜尋清單"></div>
      <button class="btn" id="dirMore" aria-label="選單" style="box-shadow:none;background:var(--page)">⋯</button>
    </div>
    <div class="dirBody" id="dirBody"></div>
  </div>

  <!-- 選單們 -->
  <div class="pop" id="rowPop"></div>
  <div class="pop" id="morePop"></div>
  <div class="pop" id="dirPop">
    <div class="it">排序方式 <span class="ic">依修改的時間 ›</span></div>
    <div class="it">依顏色篩選 <span class="ic">全部 ›</span></div>
    <div class="hr"></div>
    <div class="it">匯出備份 <span class="ic">⇪</span></div>
    <div class="it">匯入備份 <span class="ic">⇩</span></div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="home"></div>
</div>
</div>

<div class="note">
  <b>怎麼玩</b><br>
  ・底下輸入列打字 <kbd>Enter</kbd> → 那行出現在紙最上面<br>
  ・點最上面的清單名 → 目錄升起，點一塊就換紙<br>
  ・往右拖一行 → 劃掉，再拖一次 → 恢復<br>
  ・往左拖一行 → 刪除（進最近刪除）<br>
  ・按住一行 0.5 秒 → 劃掉／搬到／複製／刪除<br>
  ・右上 ⋯ → 釘選、換顏色、分享、清掉劃掉的、刪除這張<br>
  ・改名字在 ⋯ 裡；新的一張可以沒有名字<br><br>
  <span style="opacity:.7">淺色／深色跟著系統，或 <a href="#" id="darkBtn" style="color:#D7B8F3">手動切換深色</a>。尺寸是 iPhone 17（402 × 874）。</span>
</div>

const $ = id => document.getElementById(id);
const phone=$('phone'), paper=$('paper'), lines=$('lines'), title=$('title'), pin=$('pin'), input=$('input'), composer=$('composer'), face=$('face');

const label = n => n.title || (n.items.find(i => !i.done && i.t.trim()) || n.items[0] || {t:'沒有名字的一張'}).t;

function paint(){
  const c = NOTES[cur.color];
  paper.style.background = c.bg[m];
  paper.style.setProperty('--rowbg', c.bg[m]);
  paper.style.setProperty('--rule', c.rule[m]);
  title.textContent = cur.title;
  pin.hidden = !cur.pinned;
  paper.classList.toggle('fold', fold);

  const live = cur.items.filter(i => !i.done), done = cur.items.filter(i => i.done);
  lines.innerHTML = '';
  if (!cur.items.length){
    lines.innerHTML = `<div class="empty"><img src="${IMG.sleep}" alt=""><div>這張還是空的<br>想到什麼，先打在下面</div></div>`;
    return;
  }
  live.forEach(i => lines.appendChild(row(i)));
  if (done.length){
    const d = document.createElement('div'); d.className='divider'; d.innerHTML = `劃掉的 <span class="ch">⌄</span>`;
    d.onclick = () => { fold = !fold; paper.classList.toggle('fold', fold); };
    lines.appendChild(d);
    const box = document.createElement('div'); box.className='doneRows';
    done.forEach(i => box.appendChild(row(i)));
    lines.appendChild(box);
  }
  if (live.length && live.length <= 3 && !done.length) {
    const h = document.createElement('div'); h.className='hint'; h.textContent='往右滑劃掉・往左滑刪除・按住有更多'; lines.appendChild(h);
  }
}

function row(i){
  const r = document.createElement('div'); r.className = 'row' + (i.done ? ' done' : '') + (i.fresh ? ' new' : ''); i.fresh = false;
  r.innerHTML = `<div class="bg strike">${i.done ? '恢復' : '劃掉'}</div><div class="bg del">刪除</div><div class="fg"><span contenteditable="true" spellcheck="false"></span></div>`;
  const fg = r.querySelector('.fg'), span = r.querySelector('span'); span.textContent = i.t;
  span.addEventListener('blur', () => { i.t = span.textContent; });
  span.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); span.blur(); } });

  // 拖：右＝劃掉、左＝刪除；按住＝選單。純原型，門檻照 tokens（90／110）
  let sx=0, dx=0, drag=false, timer=null, moved=false;
  r.addEventListener('pointerdown', e => {
    sx = e.clientX; dx = 0; drag = true; moved = false;
    timer = setTimeout(() => { if (!moved){ drag=false; showRowMenu(i, r); } }, 500);
  });
  r.addEventListener('pointermove', e => {
    if (!drag) return; dx = (e.clientX - sx) / scale;
    if (Math.abs(dx) > 6){ moved = true; clearTimeout(timer); fg.style.transition='none'; fg.style.transform = `translateX(${dx}px)`;
      r.querySelector('.strike').style.opacity = dx > 0 ? Math.min(1, dx/60) : 0;
      r.querySelector('.del').style.opacity = dx < 0 ? Math.min(1, -dx/60) : 0; }
  });
  const up = () => {
    clearTimeout(timer); if (!drag) return; drag = false; fg.style.transition='';
    if (dx > 90){ i.done = !i.done; fold = false; navigator.vibrate && navigator.vibrate(8); fg.style.transform=''; setTimeout(paint, 150); }
    else if (dx < -110){ fg.style.transform='translateX(-110%)'; setTimeout(() => removeLine(i), 180); }
    else { fg.style.transform=''; r.querySelectorAll('.bg').forEach(b => b.style.opacity = 0); }
  };
  r.addEventListener('pointerup', up); r.addEventListener('pointercancel', up); r.addEventListener('pointerleave', () => { if (drag) up(); });
  return r;
}

function removeLine(i){
  const idx = cur.items.indexOf(i); cur.items.splice(idx, 1); paint();
  showToast('已移到最近刪除', '復原', () => { cur.items.splice(idx, 0, i); paint(); });
}

function showRowMenu(i, r){
  const rect = r.getBoundingClientRect(), pr = phone.getBoundingClientRect();
  rowPop.innerHTML = `
    <div class="it" data-a="strike">${i.done ? '恢復' : '劃掉'} <span class="ic">${i.done ? '↺' : '—'}</span></div>
    <div class="it" data-a="move">搬到… <span class="ic">›</span></div>
    <div class="it" data-a="copy">複製 <span class="ic">⧉</span></div>
    <div class="hr"></div>
    <div class="it red" data-a="del">刪除 <span class="ic">🗑</span></div>`;
  rowPop.style.right = '20px'; rowPop.style.top = Math.min((rect.bottom - pr.top)/scale + 4, 874 - 260) + 'px';
  rowPop.classList.add('show');
  rowPop.onclick = e => {
    const a = e.target.closest('.it')?.dataset.a; hidePops(); if (!a) return;
    if (a === 'strike'){ i.done = !i.done; fold = false; paint(); }
    if (a === 'del') removeLine(i);
    if (a === 'copy') showToast('已複製');
    if (a === 'move'){ moving = i; openDir(); }
  };
}
let moving = null;

/* ---------- ⋯ 選單 ---------- */
function showMore(){
  morePop.innerHTML = `
    <div class="it" data-a="rename">改名字 <span class="ic">✎</span></div>
    <div class="it" data-a="pin">${cur.pinned ? '取消釘選' : '釘選'} <span class="ic">📌</span></div>
    <div class="sw">${Object.keys(NOTES).map(k => `<i data-c="${k}" class="${k===cur.color?'on':''}" style="background:${NOTES[k].hd}" title="${NOTES[k].name}・${NOTES[k].hue}"></i>`).join('')}</div>
    <div class="hr"></div>
    <div class="it" data-a="share">分享 <span class="ic">⇪</span></div>
    <div class="it" data-a="copy">複製全文 <span class="ic">⧉</span></div>
    <div class="it" data-a="sort">排順序 <span class="ic">⋮⋮</span></div>
    <div class="it" data-a="clear">清掉劃掉的行 <span class="ic">⌫</span></div>
    <div class="hr"></div>
    <div class="it red" data-a="del">刪除這張 <span class="ic">🗑</span></div>`;
  morePop.style.right = '16px'; morePop.style.top = '118px'; morePop.classList.add('show');
  morePop.onclick = e => {
    const sw = e.target.closest('i[data-c]');
    if (sw){ cur.color = sw.dataset.c; paint(); morePop.querySelectorAll('i').forEach(x => x.classList.toggle('on', x===sw)); return; }
    const a = e.target.closest('.it')?.dataset.a; hidePops(); if (!a) return;
    if (a === 'rename'){ title.contentEditable = 'true'; title.focus(); document.execCommand && document.execCommand('selectAll', false, null); return; }
    if (a === 'pin'){ cur.pinned = !cur.pinned; paint(); showToast(cur.pinned ? '已釘選' : '已取消釘選'); }
    if (a === 'clear'){ const gone = cur.items.filter(i => i.done); cur.items = cur.items.filter(i => !i.done); paint(); showToast('已清掉劃掉的行', '復原', () => { cur.items.push(...gone); paint(); }); }
    if (a === 'copy' || a === 'share') showToast(a === 'copy' ? '已複製全文' : '（系統分享表）');
    if (a === 'sort') showToast('（排序模式：每行右邊出現把手）');
    if (a === 'del'){ const gone = cur; trash.unshift({ title: label(gone) }); notes = notes.filter(n => n !== gone); if (!notes.length) newNote(); else cur = notes[0]; paint(); showToast('已移到最近刪除', '復原', () => { trash.shift(); notes.unshift(gone); cur = gone; paint(); }); }
  };
}
function hidePops(){ [rowPop, morePop, dirPop].forEach(p => p.classList.remove('show')); }

/* ---------- 目錄 ---------- */
function openDir(){ renderDir(); phone.classList.add('open'); }
function closeDir(){ phone.classList.remove('open'); moving = null; }
function renderDir(q=''){
  const hit = notes.filter(n => !q || label(n).includes(q) || n.items.some(i => i.t.includes(q)));
  const tile = n => `<div class="tile ${n===cur && !moving ? 'cur' : ''}" data-id="${n.id}" style="background:${NOTES[n.color].bg[m]}">${esc(label(n))}<span class="tag" style="background:${NOTES[n.color].hd}"></span></div>`;
  const pinned = hit.filter(n => n.pinned), other = hit.filter(n => !n.pinned);
  let h = moving ? `<div class="sec">把「${esc(moving.t)}」搬到</div>` : '';
  h += `<div class="grid" style="margin-top:${moving?0:12}px">${moving ? '' : '<div class="tile add" data-new="1"><b>＋</b> 新的一張</div>'}${pinned.length ? '' : other.map(tile).join('')}</div>`;
  if (pinned.length) h += `<div class="sec">已釘選</div><div class="grid">${pinned.map(tile).join('')}</div><div class="sec">其他</div><div class="grid">${other.map(tile).join('')}</div>`;
  if (!hit.length) h += `<div class="empty" style="padding-top:40px">找不到含「${esc(q)}」的清單</div>`;
  if (trash.length && !moving) h += `<div class="trashRow">🗑 最近刪除 <span class="sp"></span><span>${trash.length} ›</span></div>`;
  dirBody.innerHTML = h;
}
dirBody.onclick = e => {
  const t = e.target.closest('.tile'); if (!t) return;
  if (t.dataset.new){ newNote(); closeDir(); setTimeout(() => input.focus(), 250); return; }
  const n = notes.find(n => n.id === t.dataset.id);
  if (moving){ if (n !== cur){ cur.items = cur.items.filter(i => i !== moving); n.items.unshift(moving); } const name = label(n); closeDir(); paint(); showToast(`已搬到「${name}」`); return; }
  cur = n; fold = true; closeDir(); paint();
};
$('q').oninput = e => renderDir(e.target.value.trim());
function newNote(){ cur = { id: uid(), title:'', color:'purple', pinned:false, items:[] }; notes.unshift(cur); fold = true; paint(); }
const esc = s => s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

/* ---------- 輸入列 ---------- */
face.src = IMG.calm;
input.addEventListener('input', () => { composer.classList.toggle('has', !!input.value.trim()); face.src = input.value.trim() ? IMG.happy : IMG.calm; });
composer.addEventListener('submit', e => {
  e.preventDefault(); const t = input.value.trim(); if (!t) return;
  const it = L(t); it.fresh = true; cur.items.unshift(it); input.value = ''; composer.classList.remove('has'); face.src = IMG.calm;
  paint(); lines.scrollTop = 0; input.focus();
});

/* ---------- 其他事件 ---------- */
$('titleBtn').addEventListener('click', () => { if (title.contentEditable !== 'true') openDir(); });
title.addEventListener('blur', () => { title.contentEditable = 'false'; cur.title = title.textContent.trim(); paint(); });
title.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); title.blur(); input.focus(); } });
$('moreBtn').onclick = e => { e.stopPropagation(); hidePops(); showMore(); };
$('dirMore').onclick = e => { e.stopPropagation(); dirPop.style.right='16px'; dirPop.style.top=(874*0.12+70)+'px'; dirPop.classList.toggle('show'); };
$('scrim').onclick = closeDir;
phone.addEventListener('click', e => { if (!e.target.closest('.pop') && !e.target.closest('.btn')) hidePops(); });
// 紙頂端往下拉也開目錄
let ly=0, pulling=false;
lines.addEventListener('pointerdown', e => { ly = e.clientY; pulling = lines.scrollTop === 0; });
lines.addEventListener('pointerup', e => { if (pulling && (e.clientY - ly)/scale > 70 && !e.target.closest('.row')) openDir(); pulling = false; });

let toastT;
function showToast(msg, act, fn){
  toast.innerHTML = esc(msg) + (act ? ` <b>${act}</b>` : ''); toast.classList.add('show'); clearTimeout(toastT);
  toast.querySelector('b') && (toast.querySelector('b').onclick = () => { fn(); toast.classList.remove('show'); });
  toastT = setTimeout(() => toast.classList.remove('show'), 3500);
}

/* ---------- 縮放到視窗能放下 ---------- */
let scale = 1;
function fit(){ scale = Math.min(1, (innerHeight - 32) / 874, (innerWidth - 32) / 402); $('wrap').style.transform = `scale(${scale})`; $('wrap').style.width = 402*scale+'px'; $('wrap').style.height = 874*scale+'px'; $('wrap').style.transformOrigin='top left'; }
addEventListener('resize', fit); fit();
$('darkBtn').onclick = e => { e.preventDefault(); setDark(!dark); };
paint();
</script>
</body>
