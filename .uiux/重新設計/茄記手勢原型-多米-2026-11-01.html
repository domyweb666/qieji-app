<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>茄記手勢原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 單欄手機畫面，標題區是手勢區，清單頁從上方垂下 */
:root{
  --out:#e9e1c9;
  --c-yellow:#f8efd2; --c-green:#e3efd9; --c-pink:#f6e2e2;
  --dot-yellow:#e6c15f; --dot-green:#8fbf74; --dot-pink:#e09a9a;
  --ink:#2c2530; --title:#5d4f63; --muted:#7a6f74; --line:#e8d9ae;
  --accent:#74467f; --sheet:#fffcf4; --field:#f6eedc;
  --strike:#6c9a58; --danger:#c8564d; --scrim:rgba(40,30,20,.28);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --out:#141114;
  --c-yellow:#2a2519; --c-green:#1f2a1c; --c-pink:#2d1f21;
  --dot-yellow:#c9a445; --dot-green:#73a35b; --dot-pink:#c07a7a;
  --ink:#efe7dc; --title:#d8c8e0; --muted:#a59a9e; --line:#463d2c;
  --accent:#c99ad6; --sheet:#1f1b1f; --field:#2c272b;
  --strike:#8fc078; --danger:#e07a70; --scrim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --out:#141114;
  --c-yellow:#2a2519; --c-green:#1f2a1c; --c-pink:#2d1f21;
  --dot-yellow:#c9a445; --dot-green:#73a35b; --dot-pink:#c07a7a;
  --ink:#efe7dc; --title:#d8c8e0; --muted:#a59a9e; --line:#463d2c;
  --accent:#c99ad6; --sheet:#1f1b1f; --field:#2c272b;
  --strike:#8fc078; --danger:#e07a70; --scrim:rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--out);color:var(--ink);font-family:var(--font);margin:0;
  display:flex;justify-content:center;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;max-width:440px;height:100%;overflow:hidden;
  background:var(--paper,var(--c-yellow));transition:background .3s}
#page{position:absolute;inset:0;display:flex;flex-direction:column;transform-origin:50% 30%;
  background:var(--paper,var(--c-yellow));transition:background .3s}

/* 標題手勢區 */
#hdr{position:relative;flex:none;touch-action:none;overflow:hidden;cursor:grab;
  padding:20px max(20px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line)}
#track{will-change:transform}
#title{margin:0;font-size:36px;font-weight:900;color:var(--title);letter-spacing:.02em;
  padding-right:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
#title[contenteditable="true"]{cursor:text;-webkit-user-select:text;user-select:text;
  border-bottom:2px dashed var(--accent);text-overflow:clip}
.meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:15px;
  font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:center;margin-top:12px}
.dots{display:flex;gap:3px}
.dots i{width:12px;height:4px;border-radius:2px;background:var(--muted);opacity:.28;transition:.25s}
.dots i:first-child{border-radius:3px 1px 1px 3px}
.dots i:last-child{border-radius:1px 3px 3px 1px}
.dots i:only-child{width:38px;border-radius:3px}
.dots i.on{opacity:.75;background:var(--accent)}
.dots.pulse{animation:pulse 1.4s ease-in-out 2}
@keyframes pulse{50%{opacity:.85;transform:translateY(3px)}}
.round{position:absolute;top:18px;right:max(16px,env(safe-area-inset-right,0px));width:52px;height:52px;border-radius:50%;
  border:0;background:var(--sheet);color:var(--ink);font-size:22px;letter-spacing:1px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer}

/* 筆記列 */
#rows{flex:1;overflow-y:auto;touch-action:pan-y;transition:opacity .18s}
.row{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.act{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;
  color:#fff;font-weight:700;font-size:15px;opacity:0}
.act-l{background:var(--strike)}
.act-r{background:var(--danger);justify-content:flex-end}
.face{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;
  padding:14px max(18px,env(safe-area-inset-right,0px)) 14px max(26px,env(safe-area-inset-left,0px));
  background:var(--paper,var(--c-yellow));font-size:21px;touch-action:pan-y;transition:background .3s}
.face .txt{flex:1;min-width:0;line-height:1.5;word-break:break-all}
.row.done .txt{text-decoration:line-through;color:var(--muted)}
.handle{color:var(--muted);opacity:.6;font-size:18px}
.tips{margin:16px 0 0;text-align:center;color:var(--muted);font-size:14px;line-height:2;letter-spacing:.06em}
.tips b{color:var(--accent);font-weight:700}

/* 從上方垂下的清單頁 */
#scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;touch-action:none;z-index:5}
#sheet{position:absolute;left:0;right:0;top:0;height:calc(100% - 92px);z-index:6;
  background:var(--sheet);border-radius:0 0 28px 28px;box-shadow:0 18px 40px rgba(0,0,0,.18);
  transform:translateY(-102%);display:flex;flex-direction:column}
#sheet.anim,#scrim.anim{transition:transform .34s cubic-bezier(.2,.85,.25,1),opacity .34s}
.sheet-body{flex:1;overflow-y:auto;min-height:0;
  padding:24px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px))}
.sheet-body h2{margin:0 0 14px;font-size:15px;color:var(--muted);font-weight:500;letter-spacing:.12em}
#q{width:100%;box-sizing:border-box;border:0;border-radius:16px;background:var(--field);color:var(--ink);
  font:inherit;font-size:17px;padding:14px 16px;outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{position:relative;overflow:hidden;min-height:116px;border-radius:18px;padding:14px 14px 18px;
  text-align:left;border:2.5px solid transparent;font:inherit;color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;gap:6px}
.card.cur{border-color:var(--accent)}
.card strong{font-size:18px;font-weight:700}
.card small{color:var(--muted);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card::after{content:"";position:absolute;right:-12px;bottom:-12px;width:42px;height:42px;border-radius:50%;background:var(--dot)}
.card.new{background:transparent;border:1.5px dashed var(--line);align-items:center;justify-content:center;font-size:18px;font-weight:700}
.card.new::after{display:none}
.sheet-grab{flex:none;height:42px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.sheet-grab span{width:42px;height:5px;border-radius:3px;background:var(--muted);opacity:.4}

#toast{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--sheet);border-radius:14px;padding:11px 16px;font-size:15px;
  display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:9;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <div id="page">
    <header id="hdr">
      <div id="track">
        <h1 id="title"></h1>
        <div class="meta"><span>剛剛</span><span id="date"></span></div>
      </div>
      <div class="foot"><div class="dots" id="dots"></div></div>
      <button class="round" id="more" aria-label="更多">⋯</button>
    </header>
    <div id="rows"></div>
  </div>
  <div id="scrim"></div>
  <div id="sheet" aria-label="全部清單">
    <div class="sheet-body">
      <h2>全部清單</h2>
      <input id="q" type="search" placeholder="搜尋清單" autocomplete="off">
      <div class="grid" id="grid"></div>
    </div>
    <div class="sheet-grab" id="sheetGrab"><span></span></div>
  </div>
  <div id="toast"><span id="toastMsg"></span><button id="undo" hidden>復原</button></div>
</div>

<script>
const lists=[
  {name:'跟可可可惡',color:'yellow',items:['雷飛誒飛累','好好奧好好','如果快喔呃呃可剋惡可惡好靠']},
  {name:'週末買菜',color:'green',items:['青江菜兩把','板豆腐','雞蛋一盒','貓砂']},
  {name:'影片點子',color:'pink',items:['說書：原子習慣第二集','為什麼換 iPhone 之後我開始自己做 app','番茄鐘 30 天心得']}
].map(l=>({...l,items:l.items.map(t=>({t,done:false}))}));
let cur=0, sheetOpen=false, lastDeleted=null;
const $=id=>document.getElementById(id);
const app=$('app'),page=$('page'),hdr=$('hdr'),track=$('track'),title=$('title'),rows=$('rows'),
      sheet=$('sheet'),scrim=$('scrim'),grid=$('grid'),q=$('q');

function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function render(){
  const L=lists[cur];
  app.style.setProperty('--paper',`var(--c-${L.color})`);
  title.textContent=L.name; $('date').textContent=stamp();
  $('dots').innerHTML=lists.map((_,i)=>`<i class="${i===cur?'on':''}"></i>`).join('');
  rows.innerHTML=L.items.map((it,i)=>`<div class="row${it.done?' done':''}" data-i="${i}">
    <div class="act act-l">✓ 劃掉</div><div class="act act-r">刪除 ✕</div>
    <div class="face"><span class="txt"></span><span class="handle">≡</span></div></div>`).join('')+
    `<p class="tips">點一下改字　右滑劃掉　左滑刪除<br><b>標題往下拉</b> 看全部　<b>標題左右滑</b> 換一張</p>`;
  rows.querySelectorAll('.txt').forEach((el,i)=>el.textContent=L.items[i].t);
  rows.querySelectorAll('.row').forEach(bindRow);
}
function renderGrid(){
  const k=q.value.trim();
  grid.innerHTML=`<button class="card new" id="newCard">＋ 新的一張</button>`+
    lists.map((l,i)=>({l,i})).filter(({l})=>!k||l.name.includes(k)||l.items.some(x=>x.t.includes(k)))
    .map(({l,i})=>`<button class="card${i===cur?' cur':''}" data-i="${i}" style="background:var(--c-${l.color});--dot:var(--dot-${l.color})">
      <strong></strong><small></small></button>`).join('');
  grid.querySelectorAll('.card[data-i]').forEach(b=>{const l=lists[b.dataset.i];
    b.querySelector('strong').textContent=l.name;
    b.querySelector('small').textContent=l.items.map(x=>x.t).join('、');
    b.onclick=()=>{cur=+b.dataset.i;render();closeSheet()}});
  $('newCard').onclick=()=>{const c=['yellow','green','pink'][lists.length%3];
    lists.push({name:'未命名',color:c,items:[]});cur=lists.length-1;render();closeSheet();toast('新的一張')};
}
q.addEventListener('input',renderGrid);

/* ---- 清單頁開關 ---- */
const SH=()=>sheet.offsetHeight;
function setSheet(px,anim){
  sheet.classList.toggle('anim',!!anim);scrim.classList.toggle('anim',!!anim);
  const h=SH(); let y=Math.min(px,h+(px-h)*.15);
  sheet.style.transform=`translateY(${y-h}px)`;
  scrim.style.opacity=Math.max(0,Math.min(1,y/h));
}
function openSheet(){sheetOpen=true;renderGrid();setSheet(SH(),true);scrim.style.pointerEvents='auto'}
function closeSheet(){sheetOpen=false;setSheet(0,true);scrim.style.pointerEvents='none';q.blur()}

/* ---- 通用拖曳：判斷方向後鎖定軸向 ---- */
function drag(el,{start,move,end}){
  let s=null;
  el.addEventListener('pointerdown',e=>{
    if(e.button>0||pinch)return; if(start&&start(e)===false)return;
    s={x:e.clientX,y:e.clientY,t:performance.now(),axis:null,id:e.pointerId};
  });
  el.addEventListener('pointermove',e=>{
    if(!s||e.pointerId!==s.id)return;
    if(pinch){s=null;return}
    const dx=e.clientX-s.x,dy=e.clientY-s.y;
    if(!s.axis){if(Math.hypot(dx,dy)<8)return;s.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
      try{el.setPointerCapture(e.pointerId)}catch(_){}}
    move&&move(s,dx,dy,e);
  });
  const up=e=>{if(!s||e.pointerId!==s.id)return;
    const dx=e.clientX-s.x,dy=e.clientY-s.y,dt=Math.max(1,performance.now()-s.t);
    const st=s;s=null;end&&end(st,dx,dy,dt,e)};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',e=>{if(s&&e.pointerId===s.id){const st=s;s=null;end&&end(st,0,0,999,e)}});
}

/* 標題區：下拉 = 清單頁；左右滑 = 換一張；點一下 = 改名 */
drag(hdr,{
  start:e=>!(sheetOpen||e.target.closest('button')||title.isContentEditable),
  move:(s,dx,dy)=>{
    if(s.axis==='y'){setSheet(Math.max(0,dy),false)}
    else{const edge=(dx>0&&cur===0)||(dx<0&&cur===lists.length-1);
      track.style.transition='none';track.style.transform=`translateX(${edge?dx*.3:dx}px)`}
  },
  end:(s,dx,dy,dt,e)=>{
    if(!s.axis){if(e.target===title||title.contains(e.target))startRename();return}
    if(s.axis==='y'){(dy>SH()*.2||dy/dt>.55)?openSheet():closeSheet();return}
    const dir=dx<0?1:-1,n=cur+dir;
    if((Math.abs(dx)>60||Math.abs(dx)/dt>.5)&&n>=0&&n<lists.length)switchTo(n,dir);
    else{track.style.transition='transform .3s cubic-bezier(.2,.85,.25,1)';track.style.transform='translateX(0)';
      if(Math.abs(dx)>60)toast(dir>0?'已經是最後一張':'已經是第一張')}
  }
});
function switchTo(n,dir){
  const w=hdr.offsetWidth;
  track.style.transition='transform .16s ease-in';track.style.transform=`translateX(${-dir*w}px)`;rows.style.opacity=0;
  setTimeout(()=>{cur=n;render();track.style.transition='none';track.style.transform=`translateX(${dir*w}px)`;
    track.offsetWidth;track.style.transition='transform .3s cubic-bezier(.2,.85,.25,1)';
    track.style.transform='translateX(0)';rows.style.opacity=1},160);
}
function startRename(){
  title.contentEditable='true';title.focus();
  const r=document.createRange();r.selectNodeContents(title);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
}
title.addEventListener('blur',()=>{if(title.isContentEditable){title.contentEditable='false';
  lists[cur].name=title.textContent.trim()||'未命名';title.textContent=lists[cur].name}});
title.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();title.blur()}});

/* 清單頁：底部把手往上推、點遮罩都能收起 */
[$('sheetGrab'),scrim].forEach(el=>drag(el,{
  start:()=>sheetOpen,
  move:(s,dx,dy)=>{if(s.axis==='y')setSheet(SH()+Math.min(0,dy),false)},
  end:(s,dx,dy,dt)=>{if(!s.axis||dy<-SH()*.15||dy/dt<-.5)closeSheet();else openSheet()}
}));

/* 筆記列：右滑劃掉、左滑刪除 */
function bindRow(row){
  const face=row.querySelector('.face'),L=row.querySelector('.act-l'),R=row.querySelector('.act-r');
  const i=+row.dataset.i,TH=90;
  drag(face,{
    start:()=>!sheetOpen,
    move:(s,dx)=>{if(s.axis!=='x')return;
      face.style.transition='none';face.style.transform=`translateX(${dx}px)`;
      L.style.opacity=dx>0?Math.min(1,dx/TH):0;R.style.opacity=dx<0?Math.min(1,-dx/TH):0},
    end:(s,dx)=>{
      if(s.axis==='x'&&dx<-TH){
        face.style.transition='transform .2s';face.style.transform='translateX(-110%)';
        setTimeout(()=>{const it=lists[cur].items.splice(i,1)[0];lastDeleted={list:cur,i,it};render();toast('已刪除',true)},200);return}
      if(s.axis==='x'&&dx>TH){lists[cur].items[i].done=!lists[cur].items[i].done;row.classList.toggle('done')}
      face.style.transition='transform .28s cubic-bezier(.2,.85,.25,1)';face.style.transform='translateX(0)';
      L.style.opacity=R.style.opacity=0;
    }
  });
}

/* 兩指捏合 → 縮小看全部（觸控螢幕／Mac 觸控板） */
let pinch=null;
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
page.addEventListener('touchstart',e=>{if(e.touches.length===2&&!sheetOpen){pinch={d0:dist(e.touches),s:1};
  rows.querySelectorAll('.face').forEach(f=>{f.style.transform='';});}},{passive:true});
page.addEventListener('touchmove',e=>{if(!pinch||e.touches.length<2)return;e.preventDefault();
  pinch.s=Math.max(.7,Math.min(1.04,dist(e.touches)/pinch.d0));page.style.transition='none';
  page.style.transform=`scale(${pinch.s})`;page.style.borderRadius=`${(1-pinch.s)*120}px`},{passive:false});
page.addEventListener('touchend',e=>{if(!pinch||e.touches.length>=2)return;const s=pinch.s;pinch=null;endPinch(s)});
function endPinch(s){page.style.transition='transform .3s,border-radius .3s';page.style.transform='';page.style.borderRadius='';
  if(s<.88)openSheet()}
let wheelS=1,wheelT;
app.addEventListener('wheel',e=>{if(!e.ctrlKey||sheetOpen)return;e.preventDefault();
  wheelS=Math.max(.7,Math.min(1.04,wheelS-e.deltaY*.01));page.style.transition='none';
  page.style.transform=`scale(${wheelS})`;clearTimeout(wheelT);wheelT=setTimeout(()=>{endPinch(wheelS);wheelS=1},140)},{passive:false});

/* 提示 */
let tt;
function toast(msg,undo){$('toastMsg').textContent=msg;$('undo').hidden=!undo;$('toast').classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),2600)}
$('undo').onclick=()=>{if(!lastDeleted)return;const{list,i,it}=lastDeleted;lists[list].items.splice(i,0,it);
  lastDeleted=null;cur=list;render();$('toast').classList.remove('show')};
$('more').onclick=()=>toast('更多選單（原型略）');

render();setSheet(0,false);
/* 第一次打開：清單頁探頭一下，讓人知道往下拉有東西 */
setTimeout(()=>{if(sheetOpen)return;$('dots').classList.add('pulse');setSheet(46,true);
  setTimeout(()=>{if(!sheetOpen)setSheet(0,true)},520)},700);
</script>

</body></html>
