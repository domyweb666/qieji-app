# 茄記 iOS（SwiftUI）的專案描述檔。Xcode 專案不進 repo，CI 與 limrun 用 XcodeGen 照這份產生。
# 2026-11-21 多米決定整個重寫成 SwiftUI；做法照番茄帳（E:\豆帳\ios-native）那套。
# Bundle ID 跟 Expo 版同一個：追平之後直接接手 App Store 上那個 app，使用者更新上來資料留在原地。
name: Qieji

options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "16.4" # 跟 Expo 58 版一樣（react-native 0.88 的最低版本）：不讓任何現有使用者被擋在外面

targets:
  Qieji:
    type: application
    platform: iOS
    sources:
      - Qieji
      - Shared # 控制中心按鈕的動作：app 與擴充都要編進去
    dependencies:
      - target: QiejiControls
      - target: QiejiWidgets
      - target: QiejiShare
    # App Group：跟桌面小工具交資料（1.1 expo-widgets 同一個群組）
    # iCloud 雲碟（1.1 react-native-cloud-storage 同一個容器，資料夾名「茄記」）：同步是完整版功能，買了而且開著才讀寫
    entitlements:
      path: Qieji/Qieji.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.domyweb.qieji
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.domyweb.qieji
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.org.domyweb.qieji
        com.apple.developer.icloud-container-environment: Production
    info:
      path: Qieji/Info.plist
      properties:
        CFBundleDisplayName: 茄記
        # 沒宣告語言時 App 用英文的日期格式與系統按鈕字（米說 2026-11-02 踩過）
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations:
          - zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # 個別上鎖（完整版）：打開上鎖的清單要過 Face ID（1.1 app.json 同一句）
        NSFaceIDUsageDescription: 用 Face ID 打開你上鎖的清單
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
        # 120Hz 的 iPhone 上，沒寫這個的話自己做的動畫最多 60 格（1.1 的 Expo 版有，搬過來時漏了）
        CADisableMinimumFrameDurationOnPhone: true
        # 「檔案 › iCloud 雲碟」裡看得到「茄記」資料夾（網頁版的備份丟進去會被合併進來）
        NSUbiquitousContainers:
          iCloud.org.domyweb.qieji:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: Any
            NSUbiquitousContainerName: 茄記
        # 主畫面長按圖示「記一行」：免費（App/QuickAction.swift）
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: org.domyweb.qieji.newline
            UIApplicationShortcutItemTitle: 記一行
            UIApplicationShortcutItemIconSymbolName: square.and.pencil
        # 控制中心「記一行」按鈕開 qieji://new（Expo 版同一個 scheme）
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - qieji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.qieji
        MARKETING_VERSION: "2.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # 只給 iPhone（1），跟 Expo 版的 supportsTablet: false 一樣
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"

  # 控制中心「記一行」按鈕（Expo 版 targets/controls 搬過來）。Bundle ID、kind 跟 1.1 一樣，使用者放好的那顆更新後照樣在。
  # 整個擴充設 iOS 18：控制項目是 18 才有的，更舊的 iOS 不載這個擴充，app 照常。
  QiejiControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - QiejiControls
      - Shared
    info:
      path: QiejiControls/Info.plist
      properties:
        CFBundleDisplayName: 茄記
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.qieji.controls
        # 版本號要跟 app 一樣，不然上傳會被擋
        MARKETING_VERSION: "2.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"

  # 桌面／鎖定畫面小工具（1.1 expo-widgets 換成 WidgetKit）。Bundle ID、kind 跟 1.1 一樣，使用者放好的那塊更新後照樣在。
  # 最低 iOS 照 1.1 的擴充（16.4）；iOS 17 起用系統的小工具底色
  QiejiWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - QiejiWidgets
      - path: Shared/WidgetShare.swift
      - path: Qieji/Design/Tokens.swift
    entitlements:
      path: QiejiWidgets/QiejiWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.domyweb.qieji
    info:
      path: QiejiWidgets/Info.plist
      properties:
        CFBundleDisplayName: 茄記
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.qieji.ExpoWidgetsTarget
        # 版本號要跟 app 一樣，不然上傳會被擋
        MARKETING_VERSION: "2.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"

  # 分享表裡的「茄記」：別的 app 分享文字、網址進來（2.1，免費）。不編 Core：擴充只把字放進 App Group，app 打開時才併進紙
  QiejiShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - QiejiShare
      - path: Qieji/Design/Tokens.swift
    entitlements:
      path: QiejiShare/QiejiShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.domyweb.qieji
    info:
      path: QiejiShare/Info.plist
      properties:
        CFBundleDisplayName: 茄記
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareController
          NSExtensionAttributes:
            # 只收文字和一個網址；圖片、檔案不收
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.qieji.share
        # 版本號要跟 app 一樣，不然上傳會被擋
        MARKETING_VERSION: "2.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"

  QiejiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QiejiTests
        excludes:
          - "*.storekit"
      # StoreKit 的測試商店設定檔（購買測試用，不連 App Store）：當資源帶進測試包
      - path: QiejiTests/Full.storekit
        buildPhase: resources
    dependencies:
      - target: Qieji
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.qieji.QiejiTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"

schemes:
  Qieji:
    build:
      targets:
        Qieji: all
        QiejiTests: [test]
    test:
      config: Debug
      targets:
        - QiejiTests
